name: Validate Crank LFO callbacks and host adapter
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/crank-modulation/**'
      - 'research/blackfin/crank-*'
      - 'Source/Element246*.h'
      - 'Source/Crank246*.h'
      - 'Source/Midi246.h'
      - 'Source/Drum246Modulation*.h'
      - 'Source/Value246*.h'
      - 'Source/ValueVoice246*.h'
      - 'Source/Sampler246Modulation.h'
      - 'Source/ReferenceDsp.h'
      - 'Source/Engine.h'
      - 'Source/SharedDrum246.h'
      - 'Tests/Crank246*.cpp'
      - 'Tests/RunCrank246Tests.py'
      - 'Tests/ReferenceVectors/crank246-*'
      - 'scripts/verify-crank246.py'
      - '.github/workflows/crank246.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S research/crank-modulation -B build-crank -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-crank --config Release --parallel 2
      - run: ctest --test-dir build-crank -C Release --output-on-failure
