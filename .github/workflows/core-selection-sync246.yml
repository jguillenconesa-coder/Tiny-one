name: Validate Core selection synchronization with explicit L1 responses
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/core-selection-sync/**'
      - 'research/blackfin/core-selection-sync.s.in'
      - 'research/blackfin/core-selection-sync.ld'
      - 'scripts/verify-core-selection-sync246.py'
      - '.github/workflows/core-selection-sync246.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S research/core-selection-sync -B build-core-selection-sync -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-core-selection-sync --config Release --parallel 2
      - run: ctest --test-dir build-core-selection-sync -C Release --output-on-failure
