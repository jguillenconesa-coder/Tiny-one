name: Validate Bend LFO callbacks and host adapter
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/bend-modulation/**'
      - 'research/blackfin/bend-*'
      - 'Source/Crank246*.h'
      - 'Source/Bend246*.h'
      - 'Source/Midi246.h'
      - 'Source/Drum246Modulation*.h'
      - 'Source/Value246*.h'
      - 'Source/ValueVoice246*.h'
      - 'Source/Sampler246Modulation.h'
      - 'Source/ReferenceDsp.h'
      - 'Source/Engine.h'
      - 'Source/SharedDrum246.h'
      - 'Tests/Bend246*.cpp'
      - 'Tests/RunBend246Tests.py'
      - 'Tests/ReferenceVectors/bend246-*'
      - 'scripts/verify-bend246.py'
      - '.github/workflows/bend246.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S research/bend-modulation -B build-bend -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-bend --config Release --parallel 2
      - run: ctest --test-dir build-bend -C Release --output-on-failure
