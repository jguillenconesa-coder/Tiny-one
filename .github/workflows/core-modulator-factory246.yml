name: Validate Core modulator factories and original reset composition
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/core-modulator-factory/**'
      - 'research/core-modulator-reset/CoreModulatorReset246.h'
      - 'Source/Value246*.h'
      - 'Source/Random246.h'
      - 'Source/Tremolo246.h'
      - 'research/blackfin/core-modulator-factory.s.in'
      - 'research/blackfin/core-modulator-factory-all.s.in'
      - 'research/blackfin/drum-render.ld'
      - 'Source/ReferenceDsp.h'
      - 'scripts/verify-core-modulator-factory246.py'
      - 'scripts/verify-core-modulator-factory-all246.py'
      - '.github/workflows/core-modulator-factory246.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S research/core-modulator-factory -B build-core-modulator-factory -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-core-modulator-factory --config Release --parallel 2
      - run: ctest --test-dir build-core-modulator-factory -C Release --output-on-failure
