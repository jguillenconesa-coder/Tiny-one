name: Validate FM foundation and four-operator render
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/fm-foundation/**'
      - 'research/fm-render/**'
      - 'research/blackfin/fm-render.s.in'
      - 'scripts/verify-fm246-render.py'
      - 'Source/Fm246*.h'
      - 'research/blackfin/fm-foundation.s.in'
      - 'research/blackfin/fm246-table-model.json'
      - 'scripts/verify-fm246-foundation.py'
      - 'Source/ReferenceDsp.h'
      - 'Source/Fractional246.h'
      - 'Source/ValueVoice246*.h'
      - 'Source/Random246.h'
      - 'Tests/Fm246ModulationTests.cpp'
      - 'Tests/ReferenceVectors/*fm246*.bin'
      - '.github/workflows/fm-foundation.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure independent FM verification
        run: cmake -S research/fm-foundation -B build-fm -DCMAKE_BUILD_TYPE=Release
      - name: Build FM verification
        run: cmake --build build-fm --config Release --parallel 2
      - name: Compare original instruction results
        run: ctest --test-dir build-fm -C Release --output-on-failure
      - name: Configure four-operator render verification
        run: cmake -S research/fm-render -B build-fm-render -DCMAKE_BUILD_TYPE=Release
      - name: Build four-operator render verification
        run: cmake --build build-fm-render --config Release --parallel 2
      - name: Compare original FM render and complete memories
        run: ctest --test-dir build-fm-render -C Release --output-on-failure
