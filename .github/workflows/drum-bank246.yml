name: Validate drum bank and held registry lifecycle
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/drum-bank/**'
      - 'research/drum-core/CoreDrumSampler246.h'
      - 'research/drum-voice/DrumVoice246.h'
      - 'research/blackfin/drum-bank-stream.s.in'
      - 'research/blackfin/drum-render.ld'
      - 'Source/Drum246Allocator.h'
      - 'Source/Drum246.h'
      - 'Source/Drum246Tables.h'
      - 'Source/ReferenceDsp.h'
      - 'scripts/verify-drum-bank246.py'
      - 'scripts/verify-drum-voice246.py'
      - 'scripts/verify-drum-core246.py'
      - '.github/workflows/drum-bank246.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S research/drum-bank -B build-drum-bank -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-drum-bank --config Release --parallel 2
      - run: ctest --test-dir build-drum-bank -C Release --output-on-failure
