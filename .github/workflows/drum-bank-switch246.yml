name: Validate original drum bank changer with explicit L1 service
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/drum-bank-switch/**'
      - 'research/core-modulator-factory/CoreModulatorFactory246.h'
      - 'research/core-modulator-reset/CoreModulatorReset246.h'
      - 'Source/Drum246.h'
      - 'Source/Value246*.h'
      - 'Source/Random246.h'
      - 'Source/Tremolo246.h'
      - 'research/core-selection-sync/CoreSelectionSync246.h'
      - 'research/blackfin/drum-bank-switch.s.in'
      - 'research/blackfin/drum-bank-switch.ld'
      - 'Source/ReferenceDsp.h'
      - 'scripts/verify-drum-bank-switch246.py'
      - '.github/workflows/drum-bank-switch246.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S research/drum-bank-switch -B build-drum-bank-switch -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-drum-bank-switch --config Release --parallel 2
      - run: ctest --test-dir build-drum-bank-switch -C Release --output-on-failure
