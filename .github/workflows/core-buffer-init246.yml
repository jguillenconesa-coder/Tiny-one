name: Validate shared buffer initialization and Core signal composition
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/core-buffer-init/**'
      - 'research/core-signal/CoreSignal246.h'
      - 'research/blackfin/core-buffer-init.s.in'
      - 'research/blackfin/drum-render.ld'
      - 'Source/ReferenceDsp.h'
      - 'scripts/verify-core-buffer-init246.py'
      - '.github/workflows/core-buffer-init246.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S research/core-buffer-init -B build-core-buffer-init -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-core-buffer-init --config Release --parallel 2
      - run: ctest --test-dir build-core-buffer-init -C Release --output-on-failure
