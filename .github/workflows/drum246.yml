name: Validate drum sampler reader and host adapter
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/drum-render/**'
      - 'research/blackfin/drum-*'
      - 'research/blackfin/gnu-13.1-fp-load-writeback.patch'
      - 'scripts/verify-drum246.py'
      - 'Tests/Drum246AllocationTests.cpp'
      - 'Tests/Drum246IntegrationTests.cpp'
      - 'Tests/SharedDrum246Tests.cpp'
      - 'Source/Drum246*.h'
      - 'Source/Dbox246Voice.h'
      - 'Source/Random246.h'
      - 'Source/Value246.h'
      - 'Source/ValueVoice246*.h'
      - 'Tests/Drum246LfoIntegrationTests.cpp'
      - 'Tests/Drum246ModulationTests.cpp'
      - 'Tests/ReferenceVectors/*drum*-246*.bin'
      - 'Tests/ReferenceVectors/verified-sine.bin'
      - 'scripts/verify-drum-modulation246.py'
      - 'Source/SampleData.h'
      - 'Source/Engine.h'
      - 'Source/SharedDrum246.h'
      - 'Source/Midi246*.h'
      - 'Source/Element246*.h'
      - 'Source/Crank246*.h'
      - 'Source/Bend246*.h'
      - 'Source/Phase246.h'
      - 'Source/ReferenceDsp.h'
      - 'Source/Envelope246*.h'
      - 'Source/Tremolo246*.h'
      - '.github/workflows/drum246.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S research/drum-render -B build-drum -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-drum --config Release --parallel 2
      - run: ctest --test-dir build-drum -C Release --output-on-failure
