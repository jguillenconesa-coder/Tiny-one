name: Validate Element LFO callbacks and host adapter
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/element-modulation/**'
      - 'research/blackfin/element-*'
      - 'Source/Element246*.h'
      - 'Source/Midi246.h'
      - 'Source/Drum246Modulation*.h'
      - 'Source/Value246*.h'
      - 'Source/ValueVoice246*.h'
      - 'Source/Sampler246Modulation.h'
      - 'Source/ReferenceDsp.h'
      - 'Source/Engine.h'
      - 'Source/SharedDrum246.h'
      - 'Tests/Element246*.cpp'
      - 'Tests/RunElement246Tests.py'
      - 'Tests/ReferenceVectors/element246-*'
      - 'scripts/verify-element246.py'
      - '.github/workflows/element246.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S research/element-modulation -B build-element -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-element --config Release --parallel 2
      - run: ctest --test-dir build-element -C Release --output-on-failure
