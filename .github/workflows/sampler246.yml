name: Validate melodic sampler reader and host adapter
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/sampler-render/**'
      - 'research/blackfin/sampler-*'
      - 'scripts/verify-sampler246.py'
      - 'scripts/verify-drum246.py'
      - 'Tests/Sampler246*Tests.cpp'
      - 'Source/Envelope246*.h'
      - 'Source/HybridPerformance.h'
      - 'Source/ValueVoice246*.h'
      - 'Source/Value246.h'
      - 'Source/Random246*.h'
      - 'Source/Tremolo246*.h'
      - 'Tests/Fm246ModulationTests.cpp'
      - 'Tests/ReferenceVectors/*sampler246*.bin'
      - 'Tests/ReferenceVectors/verified-sine.bin'
      - 'scripts/verify-value-voice246.py'
      - 'scripts/verify-random-voice246.py'
      - 'Source/Sampler246*.h'
      - 'Source/SampleData.h'
      - 'Source/Engine.h'
      - 'Source/SharedDrum246.h'
      - 'Source/Midi246*.h'
      - 'Source/Element246*.h'
      - 'Source/Crank246*.h'
      - 'Source/Bend246*.h'
      - 'Source/Drum246*.h'
      - 'Source/Phase246.h'
      - 'Source/ReferenceDsp.h'
      - '.github/workflows/sampler246.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S research/sampler-render -B build-sampler -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-sampler --config Release --parallel 2
      - run: ctest --test-dir build-sampler -C Release --output-on-failure
