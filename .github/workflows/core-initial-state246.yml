name: Validate Core initial state and drum event composition
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/core-initial-state/**'
      - 'research/drum-voice/DrumVoice246.h'
      - 'research/drum-core/CoreDrumSampler246.h'
      - 'research/blackfin/core-initial-state.s.in'
      - 'Source/Drum246*.h'
      - 'Source/Core246ControlWorkspace.h'
      - 'Source/ReferenceDsp.h'
      - 'scripts/verify-core-initial-state246.py'
      - 'scripts/verify-drum-event246.py'
      - '.github/workflows/core-initial-state246.yml'
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S research/core-initial-state -B build-core-initial-state -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-core-initial-state --config Release --parallel 2
      - run: ctest --test-dir build-core-initial-state -C Release --output-on-failure
